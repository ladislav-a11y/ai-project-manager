[project]
name = "ai-project-manager"
version = "0.1.0"
description = "Autonomous control layer over Trello and the ai-orchestrator"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.scripts]
ai-project-manager = "ai_project_manager.cli:main"
ai-project-manager-watchdog = "ai_project_manager.watchdog:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ai_project_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The application does not rely on pytest's cross-run cache. Disabling it
# avoids permission-sensitive cache writes in restricted Windows checkouts.
addopts = "-p no:cacheprovider"
